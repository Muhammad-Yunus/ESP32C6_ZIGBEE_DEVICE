<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="'Consolas', 'Courier New', monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8E6DF" stroke-width="0.6"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#DCD8CE" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Background & Border -->
  <g id="layer-background">
    <rect x="0" y="0" width="980" height="480" fill="#FAFAF7"/>
    <rect x="20" y="20" width="940" height="440" fill="url(#grid)" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Wires, Pull-up Resistors & Power/Ground Symbols -->
  <g id="layer-wires">
    <!-- +3V3 -->
    <line x1="290" y1="150" x2="690" y2="150" stroke="#C62828" stroke-width="2.4"/>
    <circle cx="490" cy="150" r="3.8" fill="#C62828"/>
    <line x1="490" y1="150" x2="490" y2="122" stroke="#C62828" stroke-width="2"/>
    <line x1="478" y1="122" x2="502" y2="122" stroke="#C62828" stroke-width="2.4"/>
    <text x="490" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">+3V3</text>

    <!-- I2C_SCL -->
    <line x1="290" y1="240" x2="690" y2="240" stroke="#1565C0" stroke-width="2.2"/>
    <text x="345" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1565C0">I2C_SCL</text>

    <!-- I2C_SDA -->
    <line x1="290" y1="300" x2="690" y2="300" stroke="#00695C" stroke-width="2.2"/>
    <text x="345" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#00695C">I2C_SDA</text>

    <!-- GND -->
    <line x1="290" y1="350" x2="690" y2="350" stroke="#374151" stroke-width="2.4"/>
    <circle cx="490" cy="350" r="3.8" fill="#374151"/>
    <line x1="490" y1="350" x2="490" y2="376" stroke="#374151" stroke-width="2"/>
    <line x1="478" y1="376" x2="502" y2="376" stroke="#374151" stroke-width="2.2"/>
    <line x1="482" y1="382" x2="498" y2="382" stroke="#374151" stroke-width="1.8"/>
    <line x1="486" y1="388" x2="494" y2="388" stroke="#374151" stroke-width="1.5"/>
    <text x="490" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">GND</text>

    <!-- R1: 4.7kΩ Pull-up (+3V3 -> I2C_SCL) -->
    <g id="comp-R1">
      <circle cx="430" cy="150" r="3.5" fill="#C62828"/>
      <line x1="430" y1="150" x2="430" y2="174" stroke="#1565C0" stroke-width="1.8"/>
      <path d="M 430 174 L 430 178 L 437 182 L 423 189 L 437 196 L 423 203 L 437 210 L 430 214 L 430 216" fill="none" stroke="#8B1E1E" stroke-width="1.8" stroke-linejoin="round"/>
      <line x1="430" y1="216" x2="430" y2="240" stroke="#1565C0" stroke-width="1.8"/>
      <circle cx="430" cy="240" r="3.5" fill="#1565C0"/>
      <text x="414" y="191" text-anchor="end" font-size="11" font-weight="700" fill="#8B1E1E">R1</text>
      <text x="414" y="206" text-anchor="end" font-size="10.5" font-weight="700" fill="#374151">4.7kΩ</text>
    </g>

    <!-- R2: 4.7kΩ Pull-up (+3V3 -> I2C_SDA) with bridge hop over I2C_SCL -->
    <g id="comp-R2">
      <circle cx="550" cy="150" r="3.5" fill="#C62828"/>
      <line x1="550" y1="150" x2="550" y2="174" stroke="#00695C" stroke-width="1.8"/>
      <path d="M 550 174 L 550 178 L 557 182 L 543 189 L 557 196 L 543 203 L 557 210 L 550 214 L 550 216" fill="none" stroke="#8B1E1E" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M 550 216 L 550 234 A 6 6 0 0 1 550 246 L 550 300" fill="none" stroke="#00695C" stroke-width="1.8"/>
      <circle cx="550" cy="300" r="3.5" fill="#00695C"/>
      <text x="566" y="191" text-anchor="start" font-size="11" font-weight="700" fill="#8B1E1E">R2</text>
      <text x="566" y="206" text-anchor="start" font-size="10.5" font-weight="700" fill="#374151">4.7kΩ</text>
    </g>
  </g>

  <!-- Devices -->
  <g id="layer-components">
    <!-- U1: ESP32-C6-DevKitC-1 -->
    <g id="comp-U1">
      <text x="80" y="92" font-size="13" font-weight="700" fill="#8B1E1E">U1</text>
      <rect x="80" y="100" width="210" height="280" rx="3" fill="#FFFCEB" stroke="#8B1E1E" stroke-width="2"/>
      <line x1="80" y1="134" x2="290" y2="134" stroke="#8B1E1E" stroke-width="1.2"/>
      <text x="185" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937" font-family="'Segoe UI', Arial, sans-serif">ESP32-C6-DevKitC-1</text>

      <text x="278" y="154" text-anchor="end" font-size="12" font-weight="700" fill="#C62828">3V3</text>
      <text x="278" y="244" text-anchor="end" font-size="12" font-weight="700" fill="#1565C0">GPIO6</text>
      <text x="278" y="304" text-anchor="end" font-size="12" font-weight="700" fill="#00695C">GPIO5</text>
      <text x="278" y="354" text-anchor="end" font-size="12" font-weight="700" fill="#374151">GND</text>

      <circle cx="290" cy="150" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
      <circle cx="290" cy="240" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
      <circle cx="290" cy="300" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
      <circle cx="290" cy="350" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
    </g>

    <!-- U2: ENS160 + AHT21 -->
    <g id="comp-U2">
      <text x="690" y="92" font-size="13" font-weight="700" fill="#8B1E1E">U2</text>
      <rect x="690" y="100" width="210" height="280" rx="3" fill="#FFFCEB" stroke="#8B1E1E" stroke-width="2"/>
      <line x1="690" y1="134" x2="900" y2="134" stroke="#8B1E1E" stroke-width="1.2"/>
      <text x="795" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937" font-family="'Segoe UI', Arial, sans-serif">ENS160 + AHT21</text>

      <text x="702" y="154" text-anchor="start" font-size="12" font-weight="700" fill="#C62828">VIN</text>
      <text x="702" y="244" text-anchor="start" font-size="12" font-weight="700" fill="#1565C0">SCL</text>
      <text x="702" y="304" text-anchor="start" font-size="12" font-weight="700" fill="#00695C">SDA</text>
      <text x="702" y="354" text-anchor="start" font-size="12" font-weight="700" fill="#374151">GND</text>

      <circle cx="690" cy="150" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
      <circle cx="690" cy="240" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
      <circle cx="690" cy="300" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
      <circle cx="690" cy="350" r="3.8" fill="#FAFAF7" stroke="#8B1E1E" stroke-width="1.8"/>
    </g>
  </g>
</svg>
